services:
  postgres:
    image: postgres:16-alpine
    container_name: satem-helpdesk-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-satem_helpdesk}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d satem_helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  helpdesk-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satem-helpdesk-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-satem_helpdesk}?schema=public
      JWT_SECRET: ${JWT_SECRET:-helpdesk-super-secret-jwt-key-satem-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-helpdesk-super-refresh-secret-jwt-key-satem-32}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    driver: local
